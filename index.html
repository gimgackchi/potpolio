<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMGACKCHI - Melon Soda & Pixel Desktop</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Outfit:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-vanilla: #FFFDF0;       
            --melon-soda: #7BEDC3;       
            --melon-deep: #4ECB9B;       
            --custard-cream: #FFEAA7;    
            --cherry-red: #FF6B8B;       
            --cream-light: #FFF9E6;      
            --retro-dark: #2F3640;       
            --border-width: 4px;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0; user-select: none;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%23FF6B8B" shape-rendering="crispEdges"><rect x="2" y="2" width="4" height="4" fill="%237BEDC3"/><rect x="6" y="6" width="4" height="4" fill="%237BEDC3"/><rect x="10" y="10" width="4" height="4" fill="white"/><rect x="14" y="14" width="4" height="4" fill="white"/><rect x="3" y="3" width="2" height="2"/><rect x="7" y="7" width="2" height="2"/><rect x="11" y="11" width="2" height="2"/><rect x="15" y="15" width="2" height="2"/></svg>'), auto;
        }

        body {
            background-color: var(--bg-vanilla);
            background-image: linear-gradient(rgba(123, 237, 195, 0.15) 2px, transparent 2px), linear-gradient(90deg, rgba(123, 237, 195, 0.15) 2px, transparent 2px);
            background-size: 32px 32px;
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            color: var(--retro-dark);
            height: 100vh; width: 100vw; overflow: hidden; position: relative; display: flex; flex-direction: column;
        }

        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(47, 54, 64, 0) 50%, rgba(123, 237, 195, 0.08) 50%); background-size: 100% 4px;
            z-index: 9999; pointer-events: none; opacity: 0.9; transition: opacity 0.3s;
        }
        .crt-overlay.disabled { opacity: 0; }

        .desktop-area {
            flex: 1; position: relative; padding: 40px; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: center; align-items: center; gap: 28px; z-index: 10;
        }
        @media (max-width: 768px) { .desktop-area { flex-direction: row; justify-content: center; align-content: center; padding: 16px; gap: 16px; } }

        .desktop-icon {
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 130px; height: 130px;
            border-radius: 12px; border: 3px solid transparent; transition: all 0.15s ease; cursor: pointer; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(2px); box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }
        .desktop-icon:hover { background: var(--custard-cream); border-color: var(--melon-deep); transform: translateY(-4px); box-shadow: 4px 8px 0px rgba(78, 203, 155, 0.25); }
        .desktop-icon:active { background: var(--melon-soda); border-color: var(--retro-dark); transform: translateY(1px); box-shadow: 0px 0px 0px transparent; }

        .pixel-icon-svg { width: 56px; height: 56px; image-rendering: pixelated; filter: drop-shadow(3px 3px 0px rgba(47, 54, 64, 0.2)); margin-bottom: 8px; transition: transform 0.2s; }
        .desktop-icon:hover .pixel-icon-svg { transform: scale(1.1) rotate(4deg); }

        .desktop-icon-label {
            font-family: 'Noto Sans KR', sans-serif; font-weight: 900; font-size: 0.75rem; color: var(--retro-dark);
            background-color: var(--bg-vanilla); padding: 4px 8px; border: 2px solid var(--retro-dark); border-radius: 6px;
            box-shadow: 2px 2px 0px var(--melon-deep); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .window {
            background-color: var(--bg-vanilla); border: var(--border-width) solid var(--retro-dark); box-shadow: 8px 8px 0px var(--melon-deep); position: absolute; z-index: 50; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; transition: opacity 0.2s, transform 0.1s;
        }
        .window-header {
            background: repeating-linear-gradient(45deg, var(--melon-soda), var(--melon-soda) 10px, var(--melon-deep) 10px, var(--melon-deep) 20px); color: var(--retro-dark); border-bottom: var(--border-width) solid var(--retro-dark); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: move;
        }
        .window-title { font-family: 'Press Start 2P', monospace; font-size: 0.65rem; color: var(--retro-dark); text-shadow: 1px 1px 0px var(--bg-vanilla); display: flex; align-items: center; gap: 8px; }
        .window-controls { display: flex; gap: 6px; }
        .win-ctrl {
            width: 22px; height: 22px; background: var(--custard-cream); border: 2px solid var(--retro-dark); box-shadow: 2px 2px 0px var(--cherry-red); display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: var(--retro-dark); cursor: pointer; border-radius: 4px;
        }
        .win-ctrl:active { transform: translate(1px, 1px); box-shadow: 0px 0px 0px transparent; }

        .profile-window { width: 100%; max-width: 480px; left: 50%; top: 50%; transform: translate(-50%, -50%); border-color: var(--retro-dark); box-shadow: 10px 10px 0px var(--custard-cream); }
        .profile-content { padding: 24px; display: flex; flex-direction: column; gap: 16px; background: rgba(255, 255, 255, 0.75); }
        .profile-top { display: flex; gap: 18px; align-items: center; }
